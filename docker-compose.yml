# Сообщение WARN "No services to build" при `docker compose up` часто означает, что образы уже есть
# и пересборка не запрашивалась — это не ошибка. Чтобы пересобрать: docker compose up -d --build backend primer3-service

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: primerdesigner-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=primer_backend.settings
      - PRIMER3_MICROSERVICE_URL=http://primer3-service:8001
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  primer3-service:
    build:
      context: .
      dockerfile: primer3_service/Dockerfile
    container_name: primerdesigner-primer3
    volumes:
      - ./primer3_service:/app
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,chrome-extension://*

